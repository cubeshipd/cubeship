name: Publish template catalog
on:
  push:
    branches: [master]
    paths:
      - 'templates/**'
      - 'core/template/**'
      - 'core/tools/internal/catalog/**'
      - 'core/tools/templatecatalog/**'
      - 'core/go.mod'
      - 'core/go.sum'
      - '.github/workflows/templates.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: template-catalog-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Generate the complete validated snapshot
        run: go -C core run ./tools/templatecatalog -repo .. -out "$RUNNER_TEMP/snapshot.json"
      - name: Publish independently of the site
        run: |
          if git fetch origin template-catalog; then
            git switch --detach FETCH_HEAD
          else
            git switch --orphan template-catalog
          fi
          cp "$RUNNER_TEMP/snapshot.json" snapshot.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated template catalog'
          git push origin HEAD:refs/heads/template-catalog
