# Advisory public-only pilot. Live stays disabled in the hash-pinned config.
name: Gemini pilot
run-name: "gemini:${{ github.repository }}:${{ inputs.pr }}:${{ inputs.sha }}:${{ inputs.dry_run && 'dry' || 'live' }}"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open public pull request number
        type: string
        required: true
      sha:
        description: Expected lowercase 40-character pull request head SHA
        type: string
        required: true
      dry_run:
        description: Validate public input without requesting a model diagnosis
        type: boolean
        default: true
        required: true

permissions: {}
concurrency:
  group: gemini-pilot-${{ github.repository }}
  cancel-in-progress: false

env:
  PILOT_REPOSITORY: ${{ github.repository }}
  PILOT_PR: ${{ inputs.pr }}
  PILOT_SHA: ${{ inputs.sha }}
  PILOT_DRY_RUN: ${{ inputs.dry_run }}
  PILOT_REF: ${{ github.ref }}
  PILOT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PILOT_ACTOR: ${{ github.actor }}
  PILOT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
  PILOT_RUN_ID: ${{ github.run_id }}
  PILOT_RUN_ATTEMPT: ${{ github.run_attempt }}
  PILOT_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  collect:
    if: ${{ github.repository == 'cubeshipd/cubeship' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      snapshot: ${{ steps.collect.outputs.snapshot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          token: ''
      - name: Build explicit dispatch context
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const context = {
            repo: e.PILOT_REPOSITORY, pr: Number(e.PILOT_PR), sha: e.PILOT_SHA,
            ref: e.PILOT_REF, defaultBranch: e.PILOT_DEFAULT_BRANCH,
            actor: e.PILOT_ACTOR, triggeringActor: e.PILOT_TRIGGERING_ACTOR,
            runId: Number(e.PILOT_RUN_ID), runAttempt: Number(e.PILOT_RUN_ATTEMPT),
            workflowSha: e.PILOT_WORKFLOW_SHA, dryRun: e.PILOT_DRY_RUN === 'true'
          };
          if (!['true', 'false'].includes(e.PILOT_DRY_RUN) ||
              !/^[1-9][0-9]*$/.test(e.PILOT_PR) || !Number.isSafeInteger(context.pr) ||
              !/^[a-f0-9]{40}$/.test(context.sha)) process.exit(1);
          writeFileSync(`${e.RUNNER_TEMP}/pilot-context.json`, JSON.stringify(context), { mode: 0o600, flag: 'wx' });
          NODE
      - name: Collect public metadata
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/pilot-run.mjs collect "$RUNNER_TEMP/pilot-context.json" "$RUNNER_TEMP/pilot-snapshot.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const snapshot = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pilot-snapshot.json`, 'utf8'));
          console.log(`snapshot=${JSON.stringify(snapshot)}`);
          NODE
      - name: Report collection refusal
        if: ${{ failure() }}
        run: echo 'Pilot collection refused or failed. No model diagnosis was requested.' >> "$GITHUB_STEP_SUMMARY"

  infer:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          token: ''
      - name: Bootstrap trusted inference scripts
        id: bootstrap
        env:
          SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$PILOT_REPOSITORY" = 'cubeshipd/cubeship'
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -m 700 "$RUNNER_TEMP/pilot-source"
          cd "$RUNNER_TEMP/pilot-source"
          for file in pilot-core.mjs pilot-run.mjs pilot-config.json; do
            curl --disable --fail --silent --show-error --proto '=https' --max-time 20 \
              "https://raw.githubusercontent.com/cubeshipd/cubeship/$SOURCE_SHA/.github/scripts/$file" --output "$file"
          done
          sha256sum -c - <<'HASHES' > /dev/null
          00619ad59f6a4495bce8693dc3ae0067f140c33f0821c26e72ce8632fc502fba  pilot-core.mjs
          0e42a1be26ce441990ad9fe00c7c5ca6fa70b20f694f3563f1a77d45e7f4cfb0  pilot-run.mjs
          87d680c31bb5da763a15d93c0b2ec60e10b514b3a5168174f5f0c83b02c6d9b1  pilot-config.json
          HASHES
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { config } from './pilot-core.mjs';
          console.log(`live_enabled=${config.liveEnabled === true}`);
          NODE
      - name: Build explicit dispatch context
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const context = {
            repo: e.PILOT_REPOSITORY, pr: Number(e.PILOT_PR), sha: e.PILOT_SHA,
            ref: e.PILOT_REF, defaultBranch: e.PILOT_DEFAULT_BRANCH,
            actor: e.PILOT_ACTOR, triggeringActor: e.PILOT_TRIGGERING_ACTOR,
            runId: Number(e.PILOT_RUN_ID), runAttempt: Number(e.PILOT_RUN_ATTEMPT),
            workflowSha: e.PILOT_WORKFLOW_SHA, dryRun: e.PILOT_DRY_RUN === 'true'
          };
          if (!['true', 'false'].includes(e.PILOT_DRY_RUN) ||
              !/^[1-9][0-9]*$/.test(e.PILOT_PR) || !Number.isSafeInteger(context.pr) ||
              !/^[a-f0-9]{40}$/.test(context.sha)) process.exit(1);
          writeFileSync(`${e.RUNNER_TEMP}/pilot-context.json`, JSON.stringify(context), { mode: 0o600, flag: 'wx' });
          NODE
      - name: Restore collected identity
        env:
          PILOT_SNAPSHOT: ${{ needs.collect.outputs.snapshot }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/pilot-artifact"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/pilot-snapshot.json`, JSON.stringify(JSON.parse(process.env.PILOT_SNAPSHOT)), { mode: 0o600, flag: 'wx' });
          NODE
      - name: Dry inference
        if: ${{ inputs.dry_run }}
        run: node "$RUNNER_TEMP/pilot-source/pilot-run.mjs" infer "$RUNNER_TEMP/pilot-context.json" "$RUNNER_TEMP/pilot-snapshot.json" "$RUNNER_TEMP/pilot-artifact/artifact.json"
      - name: Live inference
        if: ${{ !inputs.dry_run && steps.bootstrap.outputs.live_enabled == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node "$RUNNER_TEMP/pilot-source/pilot-run.mjs" infer "$RUNNER_TEMP/pilot-context.json" "$RUNNER_TEMP/pilot-snapshot.json" "$RUNNER_TEMP/pilot-artifact/artifact.json"
      - name: Refuse disabled live mode
        if: ${{ !inputs.dry_run && steps.bootstrap.outputs.live_enabled != 'true' }}
        run: |
          echo 'Live mode is disabled. No model diagnosis was requested.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-pilot-result
          path: ${{ runner.temp }}/pilot-artifact/artifact.json
          retention-days: 1
          if-no-files-found: error
      - name: Report inference refusal
        if: ${{ failure() }}
        run: echo 'Pilot inference refused or failed. No diagnosis is available; any attempted provider usage may be uncertain.' >> "$GITHUB_STEP_SUMMARY"

  summarize:
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          token: ''
      - name: Build explicit dispatch context
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const context = {
            repo: e.PILOT_REPOSITORY, pr: Number(e.PILOT_PR), sha: e.PILOT_SHA,
            ref: e.PILOT_REF, defaultBranch: e.PILOT_DEFAULT_BRANCH,
            actor: e.PILOT_ACTOR, triggeringActor: e.PILOT_TRIGGERING_ACTOR,
            runId: Number(e.PILOT_RUN_ID), runAttempt: Number(e.PILOT_RUN_ATTEMPT),
            workflowSha: e.PILOT_WORKFLOW_SHA, dryRun: e.PILOT_DRY_RUN === 'true'
          };
          if (!['true', 'false'].includes(e.PILOT_DRY_RUN) ||
              !/^[1-9][0-9]*$/.test(e.PILOT_PR) || !Number.isSafeInteger(context.pr) ||
              !/^[a-f0-9]{40}$/.test(context.sha)) process.exit(1);
          writeFileSync(`${e.RUNNER_TEMP}/pilot-context.json`, JSON.stringify(context), { mode: 0o600, flag: 'wx' });
          NODE
      - name: Prepare fresh artifact directory
        run: mkdir -m 700 "$RUNNER_TEMP/pilot-artifact"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gemini-pilot-result
          path: ${{ runner.temp }}/pilot-artifact
      - name: Validate downloaded artifact directory
        run: |
          node --input-type=module <<'NODE'
          import { readArtifactDirectory } from './.github/scripts/pilot-run.mjs';
          try { await readArtifactDirectory(`${process.env.RUNNER_TEMP}/pilot-artifact`); }
          catch { console.log('Artifact refused.'); process.exitCode = 1; }
          NODE
      - name: Publish verified advisory summary
        run: node .github/scripts/pilot-run.mjs summarize "$RUNNER_TEMP/pilot-context.json" "$RUNNER_TEMP/pilot-artifact/artifact.json"
      - name: Report summary refusal
        if: ${{ failure() }}
        run: echo 'Pilot summary refused or failed. No verified diagnosis is available.' >> "$GITHUB_STEP_SUMMARY"
