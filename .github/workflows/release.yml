# Publishing a release.
#
# A tag is the whole of it. `v0.2.0` is a stable release; `v0.2.0-rc.1`
# is a prerelease, because semver says a version with a hyphen in it is
# one — there is no second place to say so and disagree.
#
# What goes out is **two images at the same version**, and nothing else
# has to be hosted anywhere: install.sh pulls both and an upgrade is a
# pull. Both are built for amd64 and arm64, because the cheap VPS people
# run this on is as often one as the other.
#
# The notes are written by hand, in internal/release/notes, and are the
# same text three ways: the GitHub release's body, the CHANGELOG.md in
# the repository, and the dialog the dashboard shows after an upgrade.
# The first job refuses a tag that has none — a release nobody wrote
# notes for is one whose dialog would be blank.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # For the provenance attestation: it says this image was built from
  # this commit by this workflow, which is a thing somebody pulling a
  # self-hosted PaaS may reasonably want to check.
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.27"
  REGISTRY: ghcr.io

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Read the version and its notes
        id: read
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Semver: a hyphen makes it a prerelease. GitHub is told the
          # same thing below, and install.sh will not offer it as latest.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          file="internal/release/notes/$version.md"
          test -f "$file" || {
            echo "::error::no release notes at $file — a release nobody wrote notes for is one whose in-app dialog is blank"
            exit 1
          }
          # The body of the GitHub release is the note without its
          # header, which is metadata for the daemon rather than
          # something to read.
          awk 'f {print} /^---$/ {n++; if (n==2) f=1}' "$file" > notes.md
          test -s notes.md || { echo "::error::$file has a header and no body"; exit 1; }

      # The generated file going stale is the failure worth catching
      # here rather than after the tag exists: it is the copy people
      # read on GitHub.
      - name: The changelog matches the notes
        run: go run ./cmd/changelog -check

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  images:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: notes
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        image: [cubeshipd, cubeship]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - image: cubeshipd
            dockerfile: Dockerfile
          - image: cubeship
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **Each architecture on a machine of that architecture.** Building
      # both here would mean one of them under QEMU, and a Go toolchain
      # emulated instruction by instruction is the difference between a
      # release taking minutes and taking most of an hour — on the one
      # pipeline nobody can shorten by skipping.
      #
      # Pushed by digest, with no tag: a tag naming one architecture
      # would be a tag that is wrong for half the machines that pull it
      # for as long as the other build takes. The manifest that names
      # both is written once, below, when both exist.
      - name: Build ${{ matrix.platform }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # The daemon stamps this into its own -version output and
          # bakes the matching dashboard image into its default, which
          # is how the two stay a pair without anybody passing both.
          build-args: VERSION=${{ needs.notes.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      # The digest travels to the merge job as a file named after
      # itself: two jobs writing one artifact would race, and a name
      # per digest cannot collide.
      - name: Hand the digest on
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: ${{ matrix.image }}
    needs: [notes, images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [cubeshipd, cubeship]
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves only for a stable release. Somebody who installed
      # without naming a version must not be upgraded onto a release
      # candidate by a tag they never asked for.
      - name: Name both architectures
        working-directory: /tmp/digests
        run: |
          repo="${REGISTRY}/${OWNER}/${IMAGE}"
          set -- -t "$repo:$VERSION"
          if [ "$PRERELEASE" = "false" ]; then
            set -- "$@" -t "$repo:latest"
          fi
          for d in *; do set -- "$@" "$repo@sha256:$d"; done
          docker buildx imagetools create "$@"
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.notes.outputs.version }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}

      - name: Read the manifest's digest
        id: digest
        run: |
          repo="${REGISTRY}/${OWNER}/${IMAGE}"
          echo "digest=$(docker buildx imagetools inspect "$repo:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.notes.outputs.version }}

      # Attested on the manifest rather than per architecture: what
      # somebody pulls is the manifest, and it is the thing worth being
      # able to trace back to a commit.
      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  cli:
    name: CLI binaries
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The CLI is what somebody drives their instance from, and it runs
      # on their laptop rather than on the server — so it is the one
      # thing in a release that is not a container. Cross-compiled here
      # rather than left to `go install`, which cannot work: this module
      # is named `cubeship`, not the path it lives at, and giving it that
      # path would put an import rewrite through every file for a
      # convenience a downloaded binary already covers.
      #
      # Static, because the alternative is a binary that depends on
      # whatever libc the runner happened to have.
      - name: Build
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/cubeship" ./cmd/cubeship
            tar -czf "dist/cubeship_${VERSION}_${os}_${arch}.tar.gz" -C dist cubeship
            rm dist/cubeship
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
        env:
          VERSION: ${{ needs.notes.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*
          retention-days: 1

  publish:
    name: GitHub release
    needs: [notes, manifest, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ needs.notes.outputs.prerelease == 'true' }}
          # The two images are pulled; the CLI is downloaded, because it
          # runs on a laptop rather than on the server.
          files: dist/*
