name: PR CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.scope.outputs.core }}
      templates: ${{ steps.scope.outputs.templates }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Detect changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" | node .github/scripts/pr-ci-scope.mjs >> "$GITHUB_OUTPUT"

  fast-checks:
    name: Fast checks
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make fmt-check
      - run: go -C core test -short ./...
      - run: node --test .github/scripts/*.test.mjs
      - run: make sh-check

  templates:
    name: Template validation
    needs: [changes]
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: core/go.sum
      - run: go -C core test -short ./template ./tools/internal/catalog ./tools/templatecatalog
      - run: make catalog

  dashboard:
    name: Dashboard lint and types
    needs: [changes]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  site:
    name: Site lint, tests and types
    needs: [changes]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck

  aggregate:
    name: CI / aggregate
    needs: [changes, fast-checks, templates, dashboard, site]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate scoped results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          export function evaluatePR(needs) {
            if (!needs || typeof needs !== "object" || Array.isArray(needs))
              return { ok: false, reasons: ["Invalid aggregate input"] };
            const changes = needs.changes;
            if (!changes || changes.result !== "success" || !changes.outputs)
              return { ok: false, reasons: ["Changed components did not complete"] };
            const checks = [
              ["core", "fast-checks"],
              ["templates", "templates"],
              ["dashboard", "dashboard"],
              ["site", "site"],
            ];
            const reasons = [];
            for (const [scope, job] of checks) {
              const applicable = changes.outputs[scope];
              const result = needs[job]?.result;
              if (applicable !== "true" && applicable !== "false") {
                reasons.push(`Invalid scope: ${scope}`);
              } else if (applicable === "true" && result !== "success") {
                reasons.push(`Job ${job}: ${result ?? "missing"}`);
              } else if (applicable === "false" && result !== "skipped") {
                reasons.push(`Job ${job} should be skipped, got ${result ?? "missing"}`);
              }
            }
            return { ok: reasons.length === 0, reasons };
          }

          try {
            const result = evaluatePR(JSON.parse(process.env.NEEDS_JSON));
            console.log(JSON.stringify(result));
            process.exitCode = result.ok ? 0 : 1;
          } catch {
            console.error("Invalid NEEDS_JSON");
            process.exitCode = 1;
          }
          NODE
