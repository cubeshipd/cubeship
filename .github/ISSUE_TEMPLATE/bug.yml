name: Bug report
description: Something Cubeship does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **A security problem goes in a [private advisory](https://github.com/cubeshipd/cubeship/security/advisories/new)
        instead** — see [SECURITY.md](https://github.com/cubeshipd/cubeship/blob/master/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: "`cubeship version`, the Settings screen, or the commit SHA for a local build. If installation failed, say so."
      placeholder: "vX.Y.Z, commit SHA, or installation failed"
    validations:
      required: true

  - type: dropdown
    id: shape
    attributes:
      label: How many machines
      options:
        - One — just the box I installed on
        - A control plane and one or more workers
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: The host
      description: For install, networking or container problems, give the distribution, architecture and provider.
      placeholder: "Ubuntu 24.04, arm64, Hetzner"

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      description: |
        Include the steps to reproduce it, what happened and what you expected.
        If it involves an app, say where its image comes from — a push to
        this instance's registry, an image elsewhere, or a repository build.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: What the logs say
      description: |
        `docker logs cubeship-daemon` is the daemon's. A failed deploy keeps
        its output on the deployment itself, in the dashboard.
        Remove passwords, tokens, cookies and private keys before posting.
        If a log itself exposes a secret, use the private advisory instead.
      render: shell
