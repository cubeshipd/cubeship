# Foundry's ingester.yaml for SigNoz's Docker install, with ClickHouse's
# address read from the environment, pprof left out, and a second OTLP/HTTP
# receiver on 4319 that asks for a bearer token: the one the public domain
# reaches. 4317 and 4318 stay open to the apps on the instance.
connectors:
  signozmeter:
    dimensions:
    - name: service.name
    - name: deployment.environment
    - name: host.name
    metrics_flush_interval: 1h
exporters:
  clickhouselogsexporter:
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_logs
    sending_queue:
      enabled: false
    timeout: 45s
    use_new_schema: true
  clickhousetraces:
    datasource: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    sending_queue:
      enabled: false
    timeout: 45s
    use_new_schema: true
  metadataexporter:
    cache:
      provider: in_memory
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_metadata
    enabled: true
    timeout: 45s
  signozclickhousemeter:
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_meter
    sending_queue:
      enabled: false
    timeout: 45s
  signozclickhousemetrics:
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_metrics
    sending_queue:
      enabled: false
    timeout: 45s
extensions:
  bearertokenauth:
    token: ${env:OTLP_BEARER_TOKEN}
  signoz_health_check:
    endpoint: 0.0.0.0:13133
processors:
  batch:
    send_batch_max_size: 55000
    send_batch_size: 50000
    timeout: 5s
  batch/meter:
    send_batch_max_size: 25000
    send_batch_size: 20000
    timeout: 5s
  signozspanmetrics/delta:
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    dimensions:
    - default: default
      name: service.namespace
    - default: default
      name: deployment.environment
    - name: signoz.collector.id
    - name: service.version
    dimensions_cache_size: 100000
    enable_exp_histogram: true
    latency_histogram_buckets:
    - 100us
    - 1ms
    - 2ms
    - 6ms
    - 10ms
    - 50ms
    - 100ms
    - 250ms
    - 500ms
    - 1000ms
    - 1400ms
    - 2000ms
    - 5s
    - 10s
    - 20s
    - 40s
    - 60s
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  otlp/public:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: bearertokenauth
service:
  extensions:
  - bearertokenauth
  - signoz_health_check
  pipelines:
    logs:
      exporters:
      - clickhouselogsexporter
      - signozmeter
      - metadataexporter
      processors:
      - batch
      receivers:
      - otlp
      - otlp/public
    metrics:
      exporters:
      - signozclickhousemetrics
      - signozmeter
      - metadataexporter
      processors:
      - batch
      receivers:
      - otlp
      - otlp/public
    metrics/meter:
      exporters:
      - signozclickhousemeter
      processors:
      - batch/meter
      receivers:
      - signozmeter
    traces:
      exporters:
      - clickhousetraces
      - signozmeter
      - metadataexporter
      processors:
      - signozspanmetrics/delta
      - batch
      receivers:
      - otlp
      - otlp/public
  telemetry:
    logs:
      encoding: json
