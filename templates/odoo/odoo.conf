[options]
; The image's own two settings.
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Behind Cubeship's proxy: trust X-Forwarded-Host, -Proto and -For, so links
; are https and logs show the visitor's address.
proxy_mode = True

; Threaded, so /websocket is served on 8069 with everything else. With
; workers it would need port 8072 as well.
workers = 0

; The one database is named by PGDATABASE. No list, and no database manager
; on the domain.
list_db = False

; admin_passwd is written below at every start, from ODOO_MASTER_PASSWORD.
