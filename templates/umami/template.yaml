# yaml-language-server: $schema=https://cubeship.dev/schema/template/v1.json
version: 1
name: 'Umami'
minCubeship: "0.6.0"
project: umami

inputs:
  - key: domain
    type: domain
    label: Where the dashboard answers
  - key: appSecret
    type: secret
    label: The app's session secret
    generate: 32

databases:
  - key: db
    name: umami-db
    engine: postgres
    version: "18"
    database: umami

apps:
  - key: web
    name: web
    image: ghcr.io/umami-software/umami
    # Umami 3 runs on Postgres only, so there is no DATABASE_TYPE to set.
    tag: "3.4.0"
    port: 3000
    health: /api/heartbeat
    domains:
      - host: ${input.domain}
    attach:
      - database: db
    limits: { cpu: 1, memory: 1Gi }
    env:
      APP_SECRET: ${input.appSecret}
