# Every ${NAME} is read from the app's environment when Logstash starts.

input {
  # The domain. Anything without these credentials is answered 401.
  http {
    port => 8080
    user => "${HTTP_INPUT_USER}"
    password => "${HTTP_INPUT_PASSWORD}"
  }
  # The template publishes this port for Beats clients.
  beats {
    port => 5044
  }
}

# Parse, enrich or drop events here, between the two.

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL}"]
    user => "${ELASTICSEARCH_USER}"
    password => "${ELASTICSEARCH_PASSWORD}"
    # Into logs-generic-default, unless an event names its own
    # data_stream.type, .dataset or .namespace.
    data_stream => "true"
  }
}
